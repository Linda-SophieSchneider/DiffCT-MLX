[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diffct-mlx"
version = "2.0.1"
description = "Differentiable computed tomography with an auto-selecting backend (Torch/CUDA or Apple MLX)"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Linda-Sophie Schneider", email = "linda-sophie.schneider@fau.de"},
]
maintainers = [
    {name = "Linda-Sophie Schneider", email = "linda-sophie.schneider@fau.de"},
]
license = {text = "Apache-2.0"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

# Core dependency only. Install a backend extra for your platform:
#   pip install "diffct-mlx[cuda]"   (NVIDIA GPUs: Torch + numba-CUDA)
#   pip install "diffct-mlx[mlx]"    (Apple Silicon: MLX)
dependencies = [
    "numpy",
]

[project.optional-dependencies]
cuda = ["torch", "numba-cuda"]
mlx = ["mlx"]
zarr = ["zarr>=3"]         # optional chunked+compressed out-of-core store

[project.urls]
Homepage = "https://github.com/Linda-SophieSchneider/DiffCT-MLX"
Upstream = "https://github.com/sypsyp97/diffct"

# This branch ships two importable packages:
#   * diffct       — the Torch/numba-CUDA engine (adapted from the upstream diffct dev line)
#   * diffct_mlx   — the unified, auto-backend API (dispatches to Torch/CUDA or MLX)
[tool.hatch.build.targets.wheel]
packages = ["diffct", "diffct_mlx"]
# Ship the embedded, offline-generated spectrum/attenuation library (binary data).
artifacts = ["diffct_mlx/physics/data/*.npz"]
