[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diffct-mlx"
version = "3.2.0"
description = "Differentiable computed tomography with an auto-selecting backend (Torch/CUDA or Apple MLX)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Linda-Sophie Schneider", email = "linda-sophie.schneider@fau.de"},
]
maintainers = [
    {name = "Linda-Sophie Schneider", email = "linda-sophie.schneider@fau.de"},
]
license = {text = "Apache-2.0"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

# Core dependency only. Install a backend extra for your platform:
#   pip install "diffct-mlx[cuda]"   (NVIDIA GPUs: Torch + numba-CUDA)
#   pip install "diffct-mlx[mlx]"    (Apple Silicon: MLX)
dependencies = [
    "numpy",
]

[project.optional-dependencies]
# numba-cuda calls np.row_stack, which numpy 2.5 removed (upstream diffct pins it too)
cuda = ["torch", "numba", "numba-cuda", "numpy<2.5"]
# Portable PyTorch engine only (CPU, Apple MPS, ROCm); no native CUDA kernels
torch = ["torch", "numba", "numpy<2.5"]
mlx = ["mlx"]
zarr = ["zarr>=3"]         # optional chunked+compressed out-of-core store

[project.urls]
Homepage = "https://github.com/Linda-SophieSchneider/DiffCT-MLX"
Upstream = "https://github.com/sypsyp97/diffct"

# One importable package. The Torch / numba-CUDA engine lives in
# diffct_mlx.engine (vendored from upstream diffct 2.5.2, see ATTRIBUTION.md),
# so installing diffct-mlx never shadows the PyPI package ``diffct``.
[tool.hatch.build.targets.wheel]
packages = ["diffct_mlx"]
# Ship the embedded, offline-generated spectrum/attenuation library (binary data).
artifacts = ["diffct_mlx/physics/data/*.npz"]
